name: Deploy to TIF Staging

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to execute live deployment to TIF Staging (leave as "DRY-RUN" to validate only)'
        required: true
        default: 'DRY-RUN'
        type: string
      manifest_path:
        description: 'Manifest path or target component directory'
        required: false
        default: 'manifest/package-mass-billing.xml'
        type: string
      test_level:
        description: 'Apex Test Level'
        required: true
        default: 'RunSpecifiedTests'
        type: choice
        options:
          - RunSpecifiedTests
          - RunLocalTests
          - NoTestRun
          - RunAllTestsInOrg
      specified_tests:
        description: 'Specified Tests (comma-separated class names, only if test_level is RunSpecifiedTests)'
        required: false
        type: string
        default: 'MassBillingApprovalTest'

permissions:
  contents: read

jobs:
  deploy_staging:
    name: Deploy to TIF Staging Sandbox
    runs-on: ubuntu-latest

    steps:
      - name: Verify Deployment Confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "::warning ::Dry-run mode selected. To deploy live to TIF Staging, enter 'DEPLOY'."
          else
            echo "Live deployment to TIF Staging confirmed."
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to TIF Staging
        shell: bash
        run: |
          printf '%s' '${{ secrets.SF_STAGING_AUTH_URL }}' > sf-staging-auth-url.txt
          sf org login sfdx-url --sfdx-url-file sf-staging-auth-url.txt --alias tif-staging
          rm -f sf-staging-auth-url.txt

      - name: Execute Deployment to Staging
        shell: bash
        run: |
          DEPLOY_CMD="sf project deploy start --target-org tif-staging --wait 120"
          
          # Check Dry Run
          if [ "${{ inputs.confirm_deploy }}" != "DEPLOY" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --dry-run"
          fi
          
          # Check Manifest or Source Directory
          MANIFEST_INPUT="${{ inputs.manifest_path }}"
          if [ -n "$MANIFEST_INPUT" ]; then
            if [[ "$MANIFEST_INPUT" == *.xml ]]; then
              DEPLOY_CMD="$DEPLOY_CMD --manifest $MANIFEST_INPUT"
            else
              DEPLOY_CMD="$DEPLOY_CMD --source-dir $MANIFEST_INPUT"
            fi
          elif [ -f "manifest/package-mass-billing.xml" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --manifest manifest/package-mass-billing.xml"
          elif [ -f "manifest/package.xml" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --manifest manifest/package.xml"
          else
            DEPLOY_CMD="$DEPLOY_CMD --source-dir force-app/main/default/lwc/massBillingApproval"
          fi
          
          # Test Level Handling
          TEST_LVL="${{ inputs.test_level }}"
          SPECIFIED_TESTS="${{ inputs.specified_tests }}"

          if [ "$TEST_LVL" = "RunSpecifiedTests" ] && [ -z "$SPECIFIED_TESTS" ]; then
            SPECIFIED_TESTS="MassBillingApprovalTest"
          fi

          DEPLOY_CMD="$DEPLOY_CMD --test-level $TEST_LVL"
          
          if [ "$TEST_LVL" = "RunSpecifiedTests" ] && [ -n "$SPECIFIED_TESTS" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --tests $SPECIFIED_TESTS"
          fi
          
          echo "Executing deployment command: $DEPLOY_CMD"
          eval $DEPLOY_CMD
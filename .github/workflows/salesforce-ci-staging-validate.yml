name: Validate TIF Staging

on:
  pull_request:
    branches:
      - staging
      - release/*
  workflow_dispatch:
    inputs:
      manifest_path:
        description: 'Manifest path (e.g. manifest/package-mass-billing.xml)'
        required: false
        default: 'manifest/package-mass-billing.xml'
        type: string
      test_level:
        description: 'Apex Test Level'
        required: true
        default: 'RunSpecifiedTests'
        type: choice
        options:
          - RunSpecifiedTests
          - RunLocalTests
          - NoTestRun
          - RunAllTestsInOrg
      specified_tests:
        description: 'Specified Tests (comma-separated)'
        required: false
        type: string
        default: 'MassBillingApprovalTest'

permissions:
  contents: read

jobs:
  validate_staging:
    name: Validate Deployment against TIF Staging (Dry-Run)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to TIF Staging
        shell: bash
        run: |
          printf '%s' '${{ secrets.SF_STAGING_AUTH_URL }}' > sf-staging-auth-url.txt
          sf org login sfdx-url --sfdx-url-file sf-staging-auth-url.txt --alias tif-staging
          rm -f sf-staging-auth-url.txt

      - name: Validate Deployment
        shell: bash
        run: |
          DEPLOY_CMD="sf project deploy start --dry-run --target-org tif-staging --wait 120"
          
          MANIFEST_INPUT="${{ inputs.manifest_path }}"
          if [ -n "$MANIFEST_INPUT" ]; then
            if [[ "$MANIFEST_INPUT" == *.xml ]]; then
              DEPLOY_CMD="$DEPLOY_CMD --manifest $MANIFEST_INPUT"
            else
              DEPLOY_CMD="$DEPLOY_CMD --source-dir $MANIFEST_INPUT"
            fi
          elif [ -f "manifest/package-mass-billing.xml" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --manifest manifest/package-mass-billing.xml"
          else
            DEPLOY_CMD="$DEPLOY_CMD --source-dir force-app/main/default/lwc/massBillingApproval"
          fi
          
          TEST_LVL="${{ inputs.test_level }}"
          SPECIFIED_TESTS="${{ inputs.specified_tests }}"

          if [ "$TEST_LVL" = "RunSpecifiedTests" ] && [ -z "$SPECIFIED_TESTS" ]; then
            SPECIFIED_TESTS="MassBillingApprovalTest"
          fi

          DEPLOY_CMD="$DEPLOY_CMD --test-level $TEST_LVL"
          
          if [ "$TEST_LVL" = "RunSpecifiedTests" ] && [ -n "$SPECIFIED_TESTS" ]; then
            DEPLOY_CMD="$DEPLOY_CMD --tests $SPECIFIED_TESTS"
          fi
          
          echo "Executing validation command: $DEPLOY_CMD"
          eval $DEPLOY_CMD